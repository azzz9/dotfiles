name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: "Build full activationPackage on Linux and macOS"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Fast checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      # Optional: set CACHIX_AUTH_TOKEN in repo secrets to enable binary cache.
      # Without a token this step is skipped and builds use the public cache only.
      # Every action in this file is pinned to a commit SHA, which is what the
      # token requires: a moved action tag reaches the token, and a writable
      # cache can serve a tampered store path to every machine that pulls from it.
      - name: Configure Cachix
        if: ${{ vars.CACHIX_NAME != '' }}
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Evaluate every machine and run fast checks
        run: scripts/check.sh --fast

  linux:
    name: Build x86_64-linux
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      - name: Configure Cachix
        if: ${{ vars.CACHIX_NAME != '' }}
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: false

      - name: Build checks and the activation package
        run: scripts/check.sh

  macos:
    name: Build aarch64-darwin
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      - name: Configure Cachix
        if: ${{ vars.CACHIX_NAME != '' }}
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: false

      - name: Build checks and the activation package
        run: scripts/check.sh
