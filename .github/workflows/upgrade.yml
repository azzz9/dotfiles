# The pins are one repository fact, not one per machine: this workflow moves
# every one of them, and a machine only runs `dotfiles sync` to apply them.
#
# The bump is published before it is verified. A bump that does not build still
# leaves a pull request that records what moved and what failed, so the next
# scheduled run starts from that record instead of repeating a failure that left
# no trace. `scripts/bump-pins.sh --gate` holds back the input whose move stops
# the tree from evaluating, so one broken upstream does not freeze the others.
#
# Main requires a pull request, but no approval and no required check, so the
# merge is this workflow's own call: the build jobs are the gate, and a push or
# merge made with the job token does not start the CI workflow.
#
# Opening the pull request needs "Allow GitHub Actions to create and approve
# pull requests" in Settings > Actions > General. Every action is pinned to a
# commit SHA, as in ci.yml: a moved tag would run with this job's write token.
name: Upgrade

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# A rerun and a dispatch would force-push the same branch over each other.
concurrency:
  group: pin-upgrade
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: chore/pin-upgrade

jobs:
  bump:
    name: Move the pins
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.pr.outputs.moved }}
      number: ${{ steps.pr.outputs.number }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A dispatch on another branch still bumps the pins from the head of
          # the default branch, which is the tree the pull request is based on.
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      # No build in this job on purpose. The pull request exists first, so a tree
      # that does not build still leaves something to read. The gate inside the
      # script is the evaluation fast path: it holds back a move it rejects
      # rather than failing the run over it.
      - name: Move the pins
        run: |
          set -o pipefail
          bash scripts/bump-pins.sh --gate 2>&1 | tee "$RUNNER_TEMP/bump.log"

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          held="$(grep '^bump-pins: held .* back at its checked-in revision' "$RUNNER_TEMP/bump.log" || true)"
          if [ -n "$held" ]; then
            {
              echo "### Held back"
              echo
              echo '```'
              echo "$held"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$(git status --porcelain -- flake.lock modules/pinned-packages.nix modules/pi.nix modules/pin-names.txt)" ]; then
            if [ -n "$held" ]; then
              echo "Every pin that moved was held back."
            else
              echo "Every pin is already at its latest."
            fi
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock modules/pinned-packages.nix modules/pi.nix modules/pin-names.txt
          git switch -c "$BRANCH"
          git commit -m "chore(pins): move every pin to its latest"
          # The branch is the bot's own, so a rerun replaces its content.
          git push --force origin "$BRANCH"
          {
            echo "Every pin the repository carries, moved by \`scripts/bump-pins.sh\` in the Upgrade workflow."
            echo
            if [ -n "$held" ]; then
              echo "Held back at the checked-in revision, because the bumped tree stopped evaluating:"
              echo
              echo '```'
              echo "$held"
              echo '```'
              echo
            fi
            echo "The workflow builds this branch on Linux and macOS and merges only while both pass."
            echo "A push or merge made with the job token does not start CI, so those builds are the gate."
            echo "\`dotfiles sync\` on a machine is what applies the result."
            echo
            echo '```'
            cat "$RUNNER_TEMP/bump.log"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          # The branch is deleted on merge, so a found pull request is a rerun
          # that has not merged yet; its body takes the new log.
          number="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" \
              -F body=@"$RUNNER_TEMP/body.md" > /dev/null
          else
            number="$(gh pr create --head "$BRANCH" --base "$BASE" \
              --title "chore(pins): move every pin to its latest" \
              --body-file "$RUNNER_TEMP/body.md" | sed 's|.*/||')"
          fi
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # A bump that dies before the pull request exists leaves no other trace, so
      # the run page carries the log. That is the case the old shape could not
      # tell apart from a bump that found nothing to move.
      - name: Record the stopped bump
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/bump.log" ] || exit 0
          {
            echo "### The bump stopped before it opened a pull request"
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/bump.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.system }}
    needs: bump
    if: needs.bump.outputs.moved == 'true'
    strategy:
      # Both platforms report, so a red pull request names what is broken on
      # which one instead of hiding the second behind the first.
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-darwin
            os: macos-26
    runs-on: ${{ matrix.os }}

    steps:
      # The tree the merge would land. CI does not run on the bot's pull request,
      # so this is the only check the bump gets.
      - name: Check out the pin branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BRANCH }}

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      - name: Build the moved pins
        run: scripts/check.sh

  merge:
    name: Merge the pull request
    needs: [bump, build]
    if: needs.bump.outputs.moved == 'true'
    runs-on: ubuntu-latest

    steps:
      # No --auto: a conflicting pull request should turn this step red, not wait
      # here green until the next run. `--repo` keeps gh out of a local branch
      # cleanup the single-ref checkout cannot do.
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

  report:
    name: Report the failed build
    needs: [bump, build]
    # The pull request is the record. A build that fails says so on it, next to
    # the bump log that names what moved, instead of only in a log that expires.
    if: failure() && needs.bump.outputs.number != ''
    runs-on: ubuntu-latest

    steps:
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.bump.outputs.number }}
          RESULT: ${{ needs.build.result }}
        run: |
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          The bump did not build on every platform (build: $RESULT).

          The pull request stays open, and the next run replaces the branch with a
          fresh bump. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
