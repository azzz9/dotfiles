# The pins are one repository fact, not one per machine. This job moves them on
# a runner, checks them there, and opens a pull request. A machine then only runs
# `dotfiles apply` or `dotfiles sync`; `dotfiles upgrade` stays the by-hand way
# to move them, and `dotfiles upgrade --pins-only` is what this job runs.
#
# GitHub does not start workflows from a push or pull request the job token
# makes, so this job checks the pins itself and then dispatches `ci.yml` on the
# branch for the macOS build. The pull request therefore shows no checks of its
# own; the branch runs carry the result.
#
# Opening the pull request needs "Allow GitHub Actions to create and approve
# pull requests" in the repository's Actions settings. A schedule stops after 60
# days without repository activity, so either keep the repository busy or run
# this by hand with workflow_dispatch.
name: Upgrade

on:
  schedule:
    # Monday 03:00 UTC, noon JST.
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Two runs would force-push the same branch over each other.
concurrency:
  group: pin-upgrade
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  pins:
    name: Move the pins
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      # Optional, like CI: with the cache configured the checks below reuse what
      # a previous run built instead of fetching it again.
      - name: Configure Cachix
        if: ${{ vars.CACHIX_NAME != '' }}
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: false

      - name: Move the pins
        env:
          # The CLI works on the checkout it is pointed at. flake.nix names the
          # machine's own checkout, not the runner's.
          DOTFILES_DIR: ${{ github.workspace }}
        # The machine argument names the row to bump for. The pins are shared by
        # every machine, and --pins-only stops before the build that would need
        # a store, so any row works here.
        run: nix run .#dotfiles -- upgrade --pins-only nix-desktop

      # The same set the push guard and CI run, on the moved pins. This is the
      # Linux build; the dispatch below adds macOS.
      - name: Check the moved pins
        env:
          DOTFILES_DIR: ${{ github.workspace }}
        run: scripts/check.sh

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/pin-upgrade
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Every pin is already at its latest."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "chore(pins): move every pin to its latest"
          # The branch is the bot's own, so a rerun replaces its content.
          git push --force origin "$BRANCH"
          # The push above started no workflow, so ask for one. ci.yml carries
          # workflow_dispatch, which is the event a job token may still raise.
          attempt=1
          while ! gh workflow run ci.yml --ref "$BRANCH"; do
            if [ "$attempt" -ge 3 ]; then
              echo "could not dispatch ci.yml on $BRANCH" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          if gh pr view "$BRANCH" --json number > /dev/null 2>&1; then
            echo "Updated the existing pull request."
          else
            gh pr create --fill --head "$BRANCH" --base "$BASE"
          fi
