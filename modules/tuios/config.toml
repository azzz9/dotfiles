# TUIOS Configuration File
# Managed by Home Manager (modules/tuios.nix); do not edit directly.
# Only non-default settings and [startup] are kept here; for all options run:
#   tuios list-options
#   tuios keybinds list

[startup]
daemon = true
tiled = true
layout = "bsp"
open_default_window = false
start_in_terminal_mode = false

[appearance]
theme = "kanagawa"
background = "off"

[daemon]
keep_awake = "agents"
resume_agents = "auto"

[keybindings.global]
command_palette = ["ctrl+shift+p"]

[keybindings.terminal_mode]
terminal_focus_left = ["alt+h"]
terminal_focus_down = ["alt+j"]
terminal_focus_up = ["alt+k"]
terminal_focus_right = ["alt+l"]

[keybindings.window_management]
next_session = ["alt+shift+j"]
prev_session = ["alt+shift+k"]
next_agent = ["alt+shift+n"]
prev_agent = ["alt+shift+p"]

[keybindings.inbox]
inbox_down = ["j", "down", "ctrl+n"]
inbox_up = ["k", "up", "ctrl+p"]
